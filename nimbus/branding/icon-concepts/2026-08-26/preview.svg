        <path d="M7.9 13.4a3 3 0 0 1-.1-6 4.25 4.25 0 0 1 8.1 1.05 2.7 2.7 0 0 1 .85 4.95H7.9Z"/>
        <circle cx="11" cy="17.35" r="3.15"/>
        <path d="m13.25 19.55 3.15 3.05"/>
        <path d="M9.65 17.35h2.7"/>
        <path d="M11 16v2.7"/>
      </g>
    </symbol>
    <style>
      .label { fill: #242424; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #666; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: #777; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
