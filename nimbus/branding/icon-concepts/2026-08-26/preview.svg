  <rect width="1200" height="760" fill="#f7f4ee"/>
  <text x="64" y="68" class="label" font-size="30">Nimbus icon concept</text>
  <text x="64" y="96" class="sub">New candidate set. Activity Bar SVGs are monochrome and use currentColor.</text>

  <g transform="translate(64 142)">
    <text x="0" y="0" class="label">App icon</text>
    <rect x="0" y="30" width="250" height="250" rx="20" fill="#fff" filter="url(#shadow)"/>
    <use href="#app-icon" x="40" y="70" width="170" height="170"/>
    <text x="0" y="324" class="sub">Warm halo and cloud canopy.</text>
    <text x="0" y="348" class="sub">Three small agent signals.</text>
  </g>

  <g transform="translate(370 142)">
    <text x="0" y="0" class="label">Activity Bar, dark theme</text>
    <rect x="0" y="30" width="744" height="148" rx="14" fill="#1e1e1e"/>
    <g color="#f2f2f2">
      <use href="#activity-nimbus" x="42" y="62" width="56" height="56"/>
      <use href="#activity-tasks" x="222" y="62" width="56" height="56"/>
      <use href="#activity-settings" x="402" y="62" width="56" height="56"/>
      <use href="#activity-debug" x="582" y="62" width="56" height="56"/>
    </g>
    <g fill="#c9c9c9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
      <text x="42" y="145">Nimbus</text>
      <text x="222" y="145">Tasks</text>
      <text x="402" y="145">Settings</text>
      <text x="582" y="145">Debug</text>
    </g>
  </g>

  <g transform="translate(370 342)">
    <text x="0" y="0" class="label">Activity Bar, light theme</text>
    <rect x="0" y="30" width="744" height="148" rx="14" fill="#fbfbfb" stroke="#ded9cf"/>
    <g color="#333333">
      <use href="#activity-nimbus" x="42" y="62" width="56" height="56"/>
      <use href="#activity-tasks" x="222" y="62" width="56" height="56"/>
      <use href="#activity-settings" x="402" y="62" width="56" height="56"/>
      <use href="#activity-debug" x="582" y="62" width="56" height="56"/>
    </g>
    <g fill="#666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
      <text x="42" y="145">Nimbus</text>
      <text x="222" y="145">Tasks</text>
      <text x="402" y="145">Settings</text>
      <text x="582" y="145">Debug</text>
    </g>
  </g>

  <g transform="translate(64 545)">
    <text x="0" y="0" class="label">Small-size check</text>
    <text x="0" y="30" class="sub">32px, 24px, and 16px previews for each monochrome asset.</text>
    <g color="#2d2d2d">
      <use href="#activity-nimbus" x="0" y="58" width="32" height="32"/>
      <use href="#activity-nimbus" x="48" y="62" width="24" height="24"/>
      <use href="#activity-nimbus" x="88" y="66" width="16" height="16"/>
      <use href="#activity-tasks" x="185" y="58" width="32" height="32"/>
      <use href="#activity-tasks" x="233" y="62" width="24" height="24"/>
      <use href="#activity-tasks" x="273" y="66" width="16" height="16"/>
      <use href="#activity-settings" x="370" y="58" width="32" height="32"/>
      <use href="#activity-settings" x="418" y="62" width="24" height="24"/>
      <use href="#activity-settings" x="458" y="66" width="16" height="16"/>
      <use href="#activity-debug" x="555" y="58" width="32" height="32"/>
      <use href="#activity-debug" x="603" y="62" width="24" height="24"/>
      <use href="#activity-debug" x="643" y="66" width="16" height="16"/>
    </g>
    <g class="tiny">
      <text x="0" y="116">Nimbus</text>
      <text x="185" y="116">Tasks</text>
      <text x="370" y="116">Settings</text>
      <text x="555" y="116">Debug</text>
    </g>
  </g>
