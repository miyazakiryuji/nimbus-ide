<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="app-bg" x1="20" y1="12" x2="108" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252321"/>
      <stop offset="0.58" stop-color="#33302c"/>
      <stop offset="1" stop-color="#171918"/>
    </linearGradient>
    <radialGradient id="app-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(62 51) rotate(90) scale(49 52)">
      <stop offset="0" stop-color="#f2b487"/>
      <stop offset="0.48" stop-color="#d86f4e"/>
      <stop offset="1" stop-color="#d86f4e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="app-cloud" x1="38" y1="38" x2="89" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.62" stop-color="#ead2b5"/>
      <stop offset="1" stop-color="#c9825c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.24"/>
    </filter>
    <symbol id="app-icon" viewBox="0 0 128 128">
      <rect x="6" y="6" width="116" height="116" rx="29" fill="url(#app-bg)"/>
      <circle cx="62" cy="51" r="48" fill="url(#app-halo)"/>
      <path fill="#e38b63" opacity="0.56" d="M90.5 30.5a44 44 0 0 1 3.6 48.6 38.4 38.4 0 0 0-56.9-46.4 44.1 44.1 0 0 1 53.3-2.2Z"/>
      <path fill="url(#app-cloud)" d="M89.8 76.4H38.1a21 21 0 0 1-.7-42 25.4 25.4 0 0 1 48 6.4 18.4 18.4 0 0 1 4.4 35.6Z"/>
      <path fill="#fff7e8" opacity="0.58" d="M43.2 47.3A21.6 21.6 0 0 1 61.6 37c9.7 0 17.7 6.1 21 14.4a17 17 0 0 0-32.8 4.2 14.8 14.8 0 0 0-6.6-8.3Z"/>
      <g fill="none" stroke="#f9e5c3" stroke-width="5" stroke-linecap="round">
        <path d="M42 92h11"/>
        <path d="M58.5 98h11"/>
        <path d="M75 92h11"/>
      </g>
      <g fill="#f7d6aa">
        <circle cx="47.5" cy="92" r="2.4"/>
        <circle cx="64" cy="98" r="2.4"/>
        <circle cx="80.5" cy="92" r="2.4"/>
      </g>
    </symbol>
    <symbol id="activity-nimbus" viewBox="0 0 24 24">
