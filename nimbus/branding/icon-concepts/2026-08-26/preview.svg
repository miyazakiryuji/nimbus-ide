        <path d="M7.2 16.2a3.7 3.7 0 0 1-.1-7.4 5.1 5.1 0 0 1 9.7 1.3 3.25 3.25 0 0 1 1 6.1H7.2Z"/>
        <path d="M12 3.6v2"/>
        <path d="m8 5.3 1.2 1.5"/>
        <path d="m16 5.3-1.2 1.5"/>
      </g>
      <g fill="currentColor">
        <circle cx="8.7" cy="20" r="0.85"/>
        <circle cx="12" cy="20.7" r="0.85"/>
        <circle cx="15.3" cy="20" r="0.85"/>
      </g>
    </symbol>
    <symbol id="activity-tasks" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.9 13.4a3 3 0 0 1-.1-6 4.25 4.25 0 0 1 8.1 1.05 2.7 2.7 0 0 1 .85 4.95H7.9Z"/>
        <path d="m6.9 16.25 1.15 1.15 2.1-2.35"/>
        <path d="M12.5 16.3h4.7"/>
        <path d="m6.9 20.2 1.15 1.15 2.1-2.35"/>
        <path d="M12.5 20.25h4.7"/>
      </g>
    </symbol>
    <symbol id="activity-settings" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.9 13.4a3 3 0 0 1-.1-6 4.25 4.25 0 0 1 8.1 1.05 2.7 2.7 0 0 1 .85 4.95H7.9Z"/>
        <path d="M6.8 16.2h10.4"/>
        <path d="M6.8 19.35h10.4"/>
        <path d="M6.8 22.5h10.4"/>
      </g>
      <g fill="currentColor">
        <circle cx="10.1" cy="16.2" r="1.05"/>
        <circle cx="14.2" cy="19.35" r="1.05"/>
        <circle cx="9" cy="22.5" r="1.05"/>
      </g>
    </symbol>
    <symbol id="activity-debug" viewBox="0 0 24 24">
