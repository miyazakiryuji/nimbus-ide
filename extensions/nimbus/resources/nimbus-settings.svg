<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    設えの部屋。雲は nimbus.svg と同じ形のまま縮めて家族として残し、
    下半分を雨から歯車に替える。アクティビティバーは 24px の単色マスクなので、
    雨（細い斜線 3 本）と歯車（丸い塊）くらい質感が違わないと見分けがつかない。
    塗りは currentColor に任せる。
  -->
  <g transform="translate(3.32 -1.35) scale(0.72)">
    <path fill="currentColor" d="M17.5 18h-10A4.5 4.5 0 0 1 7 9.03 5.5 5.5 0 0 1 17.4 10.2 3.9 3.9 0 0 1 17.5 18Z"/>
  </g>
  <g fill="currentColor">
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55"/>
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55" transform="rotate(60 12 18.4)"/>
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55" transform="rotate(120 12 18.4)"/>
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55" transform="rotate(180 12 18.4)"/>
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55" transform="rotate(240 12 18.4)"/>
    <rect x="11.05" y="13.4" width="1.9" height="2.7" rx="0.55" transform="rotate(300 12 18.4)"/>
    <path fill-rule="evenodd" d="M12 14.9a3.5 3.5 0 1 0 0 7 3.5 3.5 0 1 0 0-7Zm0 1.95a1.55 1.55 0 1 1 0 3.1 1.55 1.55 0 1 1 0-3.1Z"/>
  </g>
</svg>
